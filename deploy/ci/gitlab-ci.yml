# Lostname: parity against a standby DNS provider, on a schedule (GitLab CI). Copy this job into your .gitlab-ci.yml,
# or include it from a release tag:
#   include:
#     - remote: https://raw.githubusercontent.com/lostnamehq/lostname/vX.Y.Z/deploy/ci/gitlab-ci.yml
# Then add a pipeline schedule (Build > Pipeline schedules) and set the variables below in the project's CI/CD
# settings. The job fails when the providers differ (exit 1) and when it cannot give a verdict (exit 2): an
# unmeasured standby is not a ready one. The SARIF report and the evidence bundle are kept either way.
variables:
  # The v0.1.0 image, pinned by digest; for a later release take the digest from its release notes.
  LOSTNAME_IMAGE: "ghcr.io/lostnamehq/lostname@sha256:734bcef467ba74f173f8265ee48786e7b4a596f1a0e222dd07c2effb061de9db"
  LOSTNAME_ZONE_FILE: "dns/example.test.zone"    # the zone as it should be served (a file in this repository)
  LOSTNAME_ORIGIN: "example.test"
  LOSTNAME_PROVIDER_A: "primary=192.0.2.53:53,198.51.100.53:53"  # the reference: NAME=ADDR[,ADDR]
  LOSTNAME_PROVIDER_B: "standby=203.0.113.53:53"                 # the standby
  LOSTNAME_PARENT: ""                                            # the parent's servers, for a signed zone's DS chain

lostname-parity:
  image:
    name: $LOSTNAME_IMAGE
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - set -u
    - parent=""; if [ -n "$LOSTNAME_PARENT" ]; then parent="--parent $LOSTNAME_PARENT"; fi
    - code=0
    - lostname parity --zone "$LOSTNAME_ZONE_FILE" --origin "$LOSTNAME_ORIGIN"
        --provider "$LOSTNAME_PROVIDER_A" --provider "$LOSTNAME_PROVIDER_B" $parent
        --sarif --evidence lostname-evidence > lostname-parity.sarif || code=$?
    - echo "lostname parity exited $code (0 pass, 1 findings, 2 no verdict, 3 usage)"
    - exit $code
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - lostname-parity.sarif
      - lostname-evidence/
