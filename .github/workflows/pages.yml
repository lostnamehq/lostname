# Publishes site/ plus the brand icons to GitHub Pages (custom domain lostname.be, set in the repository settings).
# site/lostname/index.html serves the go-import tags for the module path lostname.be/lostname.
name: pages
on:
  push:
    branches: [main]
    paths: [site/**, brand/final/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: assemble site/ and the brand icons
        run: |
          mkdir -p _site
          cp -r site/. _site/
          for f in favicon.svg favicon.ico apple-touch-icon.png wordmark.svg wordmark-dark.svg social.png; do
            cp "brand/final/$f" _site/
          done
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
