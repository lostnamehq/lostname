# Release: on a signed tag vX.Y.Z, build reproducibly, sign and attest, publish the binaries and the image.
# The tag is made by a maintainer after the release pull request is merged (docs/publishing.md); this workflow
# refuses a tag whose signature does not verify against lostname.allowed_signers.
name: Release
# Run by hand (Actions > Release > Run workflow), it is a dry run: tests, mutations, the two builds, OpenVEX and the
# image build, without the tag check, signing, pushing or a release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]  # a release candidate is a prerelease
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write      # the GitHub release
      id-token: write      # keyless signing and attestations (OIDC)
      attestations: write  # SLSA build provenance
      packages: write      # the image on ghcr.io
    env:
      TAG: ${{ github.ref_name }}
      IMAGE: ghcr.io/lostnamehq/lostname
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is signed by the release key
        if: github.event_name == 'push'
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git -c gpg.ssh.allowedSignersFile=lostname.allowed_signers tag -v "$TAG" 2>&1 | tee tag-verify.txt
          grep -q '^Good "git" signature' tag-verify.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          pip install -q --require-hashes -r requirements-test.txt
          go test ./...
          python -m pytest -q tests
          python tools/mutate.py
      - name: Build twice, compare
        run: |
          python tools/build.py dist
          python tools/build.py dist-again
          diff dist/SHA256SUMS dist-again/SHA256SUMS
      - name: Vulnerability statement (OpenVEX)
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -format openvex ./... > dist/lostname.openvex.json
          (cd dist && sha256sum lostname.openvex.json >> SHA256SUMS)
      - name: Dry run, image build only
        if: github.event_name != 'push'
        run: |
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --sbom=false --tag lostname:dry-run .
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name == 'push'
        with:
          cosign-release: v3.1.4
      - name: Sign the checksums (keyless)
        if: github.event_name == 'push'
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push'
        with:
          subject-path: "dist/lostname_*"
      - name: Image (linux/amd64, linux/arm64)
        id: image
        if: github.event_name == 'push'
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --sbom=false \
            --tag "$IMAGE:$TAG" --metadata-file image.json --push .
          digest=$(python -c "import json; print(json.load(open('image.json'))['containerimage.digest'])")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          cosign sign --yes "$IMAGE@$digest"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push'
        with:
          subject-name: ghcr.io/lostnamehq/lostname
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python tools/release_notes.py "$TAG" "$DIGEST" > notes.md
          pre=""; case "$TAG" in *-rc.*) pre="--prerelease";; esac
          gh release create "$TAG" dist/lostname_* dist/SHA256SUMS dist/SHA256SUMS.sigstore.json \
            dist/lostname.openvex.json --verify-tag --title "$TAG" --notes-file notes.md $pre
